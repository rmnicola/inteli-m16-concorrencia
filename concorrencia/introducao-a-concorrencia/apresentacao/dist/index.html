:root {
  /* Paleta institucional */
  --roxo: #2e2640;
  --coral: #ff4545;
  --lilas: #90a5e5;
  --verde: #89cea5;
  --verde-escuro: #066d73;     /* cor do segmento MBA & EXEC */
  --cinza-escuro: #b2b6bf;
  --cinza-medio: #caced6;
  --cinza-claro: #e6eaeb;
  --branco: #ffffff;

  /* Papéis */
  --fundo: var(--cinza-claro);
  --texto: var(--roxo);
  --texto-suave: #5d5870;
  --coral-texto: #d63333;      /* coral levemente escurecido: só para TEXTO sobre fundo claro (contraste 3,96). Formas usam --coral */
  --destaque: var(--coral-texto);

  /* Tipografia (Platypi substitui a Azurio, como orienta o template) */
  --f-capitulo: "Platypi", Georgia, serif;
  --f-texto: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --f-destaque: "Space Mono", "Courier New", monospace;

  /* Escala, em px da tela de 1600 × 900. Nada abaixo de 28px na tela. */
  --t-capitulo: 96px;
  --t-titulo: 64px;
  --t-ideia: 72px;
  --t-subtitulo: 40px;
  --t-texto: 34px;
  --t-destaque: 28px;
  --t-legenda: 28px;

  /* Grade */
  --margem-x: 120px;
  --margem-y: 96px;
  --vao: 48px;
}

/* ---------- Estrutura e apresentação na tela ---------- */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; background: #111; overflow: hidden; }

.deck { position: fixed; inset: 0; }

.slide {
  position: absolute; top: 50%; left: 50%;
  width: 1600px; height: 900px;
  transform-origin: center center;
  transform: translate(-50%, -50%) scale(var(--escala, 1));
  background: var(--fundo); color: var(--texto);
  font-family: var(--f-texto); font-size: var(--t-texto); line-height: 1.35;
  overflow: hidden;
  display: none;
}
.slide.atual { display: block; }

.slide > .conteudo {
  position: absolute;
  inset: var(--margem-y) var(--margem-x);
  display: flex; flex-direction: column; justify-content: center; gap: var(--vao);
}

/* Notas do professor: nunca aparecem no slide. */
.slide .notas { display: none !important; }

/* Passos: entram um a um a cada avanço (deck.js). O espaço fica reservado, então nada pula. */
.slide .passo { transition: opacity .4s ease, visibility .4s; }   /* visibility também transiciona, para o elemento esmaecer ao sair */
.slide .passo:not(.visivel) { opacity: 0; visibility: hidden; }

/* Número do slide, discreto, no canto inferior direito. */
.slide::after {
  content: attr(data-numero);
  position: absolute; right: 40px; bottom: 28px;
  font-family: var(--f-destaque); font-size: 20px; color: var(--cinza-escuro);
}
.slide.sem-numero::after { content: none; }

/* Logo inteli (logo-inteli-*.png na graduação, logo-exec-*.png no Exec): canto superior direito nos slides de conteúdo. */
.slide .logo {
  position: absolute; top: 56px; right: 64px; height: 56px; width: auto;
}

/* ---------- Hierarquia tipográfica (do template) ---------- */

.capitulo {
  font-family: var(--f-capitulo); font-weight: 400;
  font-size: var(--t-capitulo); line-height: 1.2;
  text-transform: uppercase; color: var(--texto);
}
.titulo { font-weight: 700; font-size: var(--t-titulo); line-height: 1.12; }
.subtitulo { font-weight: 400; font-size: var(--t-subtitulo); line-height: 1.3; color: var(--texto-suave); }
.destaque {
  font-family: var(--f-destaque); font-weight: 700; font-size: var(--t-destaque);
  text-transform: uppercase; letter-spacing: .04em; color: var(--destaque);
}
.texto { font-size: var(--t-texto); max-width: 30ch; }
.legenda { font-size: var(--t-legenda); color: var(--texto-suave); }
strong, b { font-weight: 800; }
em { font-style: normal; color: var(--destaque); }

/* Termo em destaque: o nome de um conceito, discreto, no slide em que ele acontece.
   Não existe slide só de termo: o termo aparece dentro da explicação. Posicione com style ou CSS do deck. */
.rotulo-termo { position: absolute; font-family: var(--f-destaque); font-weight: 700; font-size: 28px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--destaque); }

/* Moldura coral em volta de uma palavra: o motivo visual do template. */
.moldura {
  display: inline-block; padding: 0 .16em; line-height: 1.12;
  outline: 3px solid var(--coral); outline-offset: 0;
}

/* Retângulo cinza translúcido, grafismo do template. */
.bloco-cinza {
  position: absolute; background: var(--cinza-medio); opacity: .55; z-index: 0;
}
.slide > .conteudo, .slide > .logo { z-index: 1; }

/* ---------- Variantes de fundo ---------- */

.slide.escuro { --fundo: var(--roxo); --texto: var(--branco); --texto-suave: var(--cinza-medio); --destaque: var(--coral); }
.slide.verde { --fundo: var(--verde-escuro); --texto: var(--branco); --texto-suave: var(--cinza-claro); --destaque: var(--verde); }
.slide.painel .lado { --destaque: var(--coral); }
.slide.branco { --fundo: var(--branco); }
.slide.escuro::after, .slide.verde::after { color: rgba(255,255,255,.45); }

.slide .esfera {
  position: absolute; right: -160px; top: 90px;   /* sem translateY: no PDF, o deslocamento quebraria a página */
  height: 720px; width: auto; opacity: .9; z-index: 0;
}

/* Objeto: algo de fora representado no slide (página de artigo, tela de sistema, documento).
   Dentro dele vale a aparência do objeto: fonte própria, texto pequeno. As verificações de
   tamanho mínimo, contraste e contagem de palavras não se aplicam ao que está dentro dele. */
.objeto { position: absolute; background: var(--branco); color: #1a1a1a; box-shadow: 0 18px 50px rgba(46, 38, 64, .18); }

/* ---------- Pontos de partida (layouts opcionais) ----------
   Capa: abertura das aulas da graduação. Boas-vindas e pesquisa: telas oficiais do Exec.
   Os demais são recorrentes, não obrigatórios. */

/* Boas-vindas: tela oficial da Educação Executiva. */
.slide.boas-vindas .bloco-cinza { left: 0; top: 0; width: 512px; height: 778px; }
.slide.boas-vindas .logo { position: static; height: 64px; align-self: flex-start; }
.slide.boas-vindas .conteudo { justify-content: flex-start; gap: 40px; padding-top: 8px; }
.slide.boas-vindas .capitulo { font-size: 92px; line-height: 1.12; }
.slide.boas-vindas .capitulo b { font-weight: 700; }
.slide.boas-vindas .rodape {
  position: absolute; right: var(--margem-x); bottom: 140px; text-align: center;
  font-family: var(--f-capitulo); font-size: 30px; line-height: 1.35;
}

/* Capa da graduação: a capa triangular das aulas do M11 (02-aulas/(2026) M11 - Encontro N.pptx).
   Medidas convertidas do slide original (1920 × 1080) para 1600 × 900. */
.slide.capa::before, .slide.capa::after { content: ""; position: absolute; inset: 0; }
.slide.capa::before { background: var(--roxo); clip-path: polygon(0 0, 508px 0, 508px 517px, 0 883px); }
.slide.capa::after  { background: var(--coral); clip-path: polygon(508px 517px, 1183px 900px, 0 900px, 0 883px); }
.slide.capa .logo { top: 90px; right: 91px; height: 123px; }
.slide.capa .conteudo { left: 560px; right: 119px; align-items: flex-end; text-align: right; gap: 8px; }
.slide.capa .titulo-capa { font-size: 80px; font-weight: 300; line-height: 1.15; }
.slide.capa .autor { font-size: 64px; font-weight: 300; line-height: 1.15; }

/* Agenda: a mesma lista em todos os slides de agenda, com o item atual destacado (data-agora, a partir de 0).
   O deck monta os itens de uma fonte única: <div class="itens"><p class="rotulo-agenda">Agenda</p><p class="item"><span class="marcador">…</span>texto</p>…</div>.
   O marcador é o horário (Exec) ou o número do item (graduação). Itens que já passaram ficam suaves. */
.slide.agenda .itens { position: absolute; left: 330px; top: 60px; bottom: 0; width: 1000px;
  display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.slide.agenda .rotulo-agenda { font-family: var(--f-destaque); font-weight: 700; font-size: 28px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--destaque); padding: 0 30px 14px; }
.slide.agenda .item { cursor: pointer; display: flex; align-items: center; gap: 40px; padding: 9px 30px; border-radius: 14px; font-size: 34px; font-weight: 600; }
.slide.agenda .item .marcador { font-family: var(--f-destaque); font-weight: 700; font-size: 32px; width: 120px; flex: none; }
.slide.agenda .item.passou { color: var(--texto-suave); font-weight: 500; }
.slide.agenda .item.passou .marcador { color: var(--texto-suave); font-weight: 400; }
.slide.agenda .item.agora { background: var(--roxo); color: var(--branco); font-weight: 800; }
.slide.agenda .item:not(.agora):hover { background: var(--branco); }
.slide.agenda .item.agora .marcador { color: var(--coral); }
.slide.agenda.curta .item { font-size: 44px; padding: 14px 30px; }
.slide.agenda.curta .item .marcador { font-size: 40px; width: 96px; }

/* Capítulo: abre uma parte da aula. */
.slide.capitulo-slide .bloco-cinza { left: 0; top: 0; width: 420px; height: 100%; }
.slide.capitulo-slide .conteudo { justify-content: center; }
.slide.capitulo-slide .numero-capitulo { font-family: var(--f-destaque); font-size: 32px; color: var(--destaque); }

/* Ideia: uma frase só, grande. O slide mais comum de um deck minimalista. */
.slide.ideia .frase { font-weight: 700; font-size: var(--t-ideia); line-height: 1.15; max-width: 22ch; }

/* Termo: apresenta um conceito (token, contexto, agente...). */
.slide.termo .palavra { font-family: var(--f-capitulo); font-size: 128px; line-height: 1; }
.slide.termo .definicao { font-size: 40px; line-height: 1.3; max-width: 28ch; }

/* Painel: texto à esquerda, painel colorido à direita com imagem ou palavra. */
.slide.painel .conteudo { right: calc(560px + var(--margem-x)); }
.slide.painel .lado {
  position: absolute; top: 0; right: 0; width: 560px; height: 100%;
  background: var(--roxo); color: var(--branco);
  display: flex; align-items: center; justify-content: center; padding: 64px;
}
.slide.painel .lado.verde { background: var(--verde-escuro); }
.slide.painel .lado img { max-width: 100%; max-height: 100%; }
.slide.painel .lado .grande { font-family: var(--f-capitulo); font-size: 88px; line-height: 1.05; text-align: center; }

/* Imagem: a imagem ocupa o slide; legenda opcional embaixo. */
.slide.imagem .conteudo { inset: 64px var(--margem-x) 96px; align-items: center; }
.slide.imagem .conteudo img { max-width: 100%; max-height: 100%; object-fit: contain; min-height: 0; }

/* Citação. */
.slide.citacao .aspas { font-size: 52px; line-height: 1.3; max-width: 26ch; }
.slide.citacao .autor { font-weight: 700; font-size: 32px; color: var(--destaque); }

/* Pesquisa: QR code da avaliação do encontro. */
.slide.pesquisa .dia { position: absolute; top: 96px; left: 96px; font-family: var(--f-capitulo); font-size: 30px; }
.slide.pesquisa .conteudo { flex-direction: row; align-items: center; justify-content: flex-start; gap: 40px; left: 200px; }
.slide.pesquisa .qr {
  width: 400px; height: 400px; background: var(--branco); padding: 28px; flex: none;
  outline: 3px solid var(--coral);
}
.slide.pesquisa .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
.slide.pesquisa .chamada { display: flex; flex-direction: column; gap: 28px; }
.slide.pesquisa .capitulo { font-size: 80px; }
.slide.pesquisa .instrucao { display: flex; gap: 20px; align-items: center; font-size: 34px; line-height: 1.3; }
.slide.pesquisa .seta {
  flex: none; width: 76px; height: 60px; border: 3px solid var(--coral); border-radius: 6px;
  display: grid; place-items: center; color: var(--coral-texto); font-size: 40px; line-height: 1;
}

/* ---------- Ajuda guiada (deck.js): botão "?" e balões ---------- */
.slide .ajuda-botao { position: absolute; right: 84px; bottom: 18px; width: 48px; height: 48px; border-radius: 50%; z-index: 20;
  border: 3px solid var(--roxo); background: var(--branco); color: var(--roxo); font: 700 28px/1 var(--f-destaque); cursor: pointer; }
.slide .ajuda-camada { position: absolute; inset: 0; z-index: 30; }
.slide .ajuda-foco { position: absolute; outline: 5px solid var(--coral); border-radius: 10px;
  box-shadow: 0 0 0 3000px rgba(46, 38, 64, .45); pointer-events: none; transition: all .25s ease; }
.slide .ajuda-balao { position: absolute; background: var(--branco); color: var(--roxo); border: 3px solid var(--roxo); border-radius: 14px;
  padding: 24px 28px; box-shadow: 0 18px 50px rgba(46, 38, 64, .3); }
.slide .ajuda-balao p { font-size: 30px; line-height: 1.3; }
.slide .ajuda-notas { margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--cinza-medio); display: flex; flex-direction: column; gap: 4px;
  font-size: 28px; line-height: 1.25; color: var(--texto-suave); }
.slide .ajuda-notas b { font-family: var(--f-destaque); font-weight: 700; color: var(--texto); }
.slide .ajuda-acoes { display: flex; gap: 14px; align-items: center; justify-content: flex-end; margin-top: 18px; }
.slide .ajuda-acoes .ajuda-conta { margin-right: auto; font: 28px var(--f-destaque); color: var(--texto-suave); }
.slide .ajuda-acoes button { font: 28px/1.2 var(--f-texto); padding: 4px 18px; border: 3px solid var(--roxo); background: transparent; color: var(--roxo); cursor: pointer; border-radius: 8px; }
.slide .ajuda-acoes button.ativo { background: var(--roxo); color: var(--branco); }
@media print { .slide .ajuda-botao, .slide .ajuda-camada { display: none !important; } }

/* ---------- Impressão / PDF: um slide por página ---------- */

@page { size: 1600px 900px; margin: 0; }
@media print {
  html, body { background: none; overflow: visible; height: auto; }
  .deck { position: static; }
  .slide {
    display: block !important; position: relative; top: auto; left: auto; transform: none;
    page-break-after: always; break-after: page;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .slide:last-child { page-break-after: auto; break-after: auto; }
  .slide .passo:not(.visivel) { opacity: 0 !important; visibility: hidden !important; }   /* o PDF mostra o último estado do slide */
}

<script>
/* Navegação do deck Inteli.
   L, →, espaço, Enter, PageDown: avança (próximo passo da animação ou próximo slide)
   H, ←, Backspace, PageUp: volta um passo
   J, ↓: pula para o próximo slide, ignorando as animações (o slide aparece completo)
   K, ↑: pula para o slide anterior, ignorando as animações (o slide aparece completo)
   Home/End: primeiro e último · F: tela cheia · #N na URL: abre no slide N.
   Toque: arrastar navega e o gesto de zoom liga a tela cheia (veja "Celular e tablet", no fim).
   Passos: elementos com a classe .passo entram a cada avanço, antes do próximo slide.
   data-passo="N": entra no passo N (padrão: a ordem no HTML) · data-sai="N": some no passo N.
   Um elemento .passo com data-passo="0" começa visível (útil com data-sai). */
(function () {
  const slides = Array.from(document.querySelectorAll(".slide"));
  let atual = 0;

  slides.forEach((s, i) => s.setAttribute("data-numero", i + 1));

  /* Cada elemento .passo entra no passo data-passo (padrão: sua ordem no HTML) e,
     se tiver data-sai, some no passo data-sai. Os estados do slide são os valores distintos
     de data-passo e data-sai, em ordem. Estado 0 = antes do primeiro passo. */
  const passosDe = (s) => {
    const els = Array.from(s.querySelectorAll(".passo"));
    const itens = els.map((el, i) => ({
      el,
      entra: el.dataset.passo !== undefined ? parseFloat(el.dataset.passo) : i + 1,
      sai: el.dataset.sai !== undefined ? parseFloat(el.dataset.sai) : Infinity,
    }));
    const marcos = [...new Set(itens.flatMap((x) => [x.entra, x.sai]).filter((v) => v > 0 && v !== Infinity))].sort((a, b) => a - b);
    return { itens, marcos };
  };

  /* Mostra o slide no estado n (0 = inicial; Infinity = último estado). */
  function mostrarPassos(s, n) {
    const { itens, marcos } = passosDe(s);
    const k = Math.min(n, marcos.length);
    const limite = k === 0 ? 0 : marcos[k - 1];
    itens.forEach((x) => x.el.classList.toggle("visivel", x.entra <= limite && limite < x.sai));
    s.dataset.estado = k;
  }
  const visiveis = (s) => parseInt(s.dataset.estado || "0", 10);
  const totalPassos = (s) => passosDe(s).marcos.length;

  /* Na tela cheia de um celular em pé, o slide gira 90° para ocupar a tela (veja "Celular e tablet"). */
  function escalar() {
    const raiz = document.documentElement;
    const girado = raiz.classList.contains("tela-cheia") && window.innerHeight > window.innerWidth;
    raiz.classList.toggle("girado", girado);
    const [w, h] = girado ? [window.innerHeight, window.innerWidth] : [window.innerWidth, window.innerHeight];
    raiz.style.setProperty("--escala", Math.min(w / 1600, h / 900));
  }

  /* Retângulo de um elemento em coordenadas do slide (1600 × 900), mesmo com o slide girado. */
  function noSlide(el, s) {
    const R = s.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (!document.documentElement.classList.contains("girado")) {
      const e = R.width / 1600;
      return { x: (r.left - R.left) / e, y: (r.top - R.top) / e, w: r.width / e, h: r.height / e };
    }
    /* girado 90° no sentido horário: o x do slide desce pela tela e o y vai para a esquerda */
    const e = R.height / 1600;
    return { x: (r.top - R.top) / e, y: (R.right - r.right) / e, w: r.height / e, h: r.width / e };
  }

  function ir(n, atualizarUrl = true, passos = 0) {
    if (typeof fecharAjuda === "function") fecharAjuda();
    atual = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, i) => s.classList.toggle("atual", i === atual));
    mostrarPassos(slides[atual], passos);
    if (atualizarUrl) history.replaceState(null, "", "#" + (atual + 1));
  }

  function avancar() {
    const s = slides[atual];
    if (visiveis(s) < totalPassos(s)) mostrarPassos(s, visiveis(s) + 1);
    else if (atual < slides.length - 1) ir(atual + 1);
  }

  function voltar() {
    const s = slides[atual];
    if (visiveis(s) > 0) mostrarPassos(s, visiveis(s) - 1);
    else if (atual > 0) ir(atual - 1, true, Infinity);
  }

  function lerUrl() {
    const n = parseInt(location.hash.slice(1), 10);
    ir(Number.isFinite(n) ? n - 1 : 0, false);
  }

  /* Agenda: clicar num item leva ao slide de agenda daquele item (data-agora = posição do item). */
  document.addEventListener("click", (ev) => {
    const item = ev.target.closest && ev.target.closest(".slide.agenda .item");
    if (!item) return;
    const pos = Array.from(item.parentElement.querySelectorAll(".item")).indexOf(item);
    const destino = slides.findIndex((s) => s.classList.contains("agenda") && parseInt(s.dataset.agora, 10) === pos);
    if (destino >= 0) ir(destino);
  });

  /* Slides interativos: teclas digitadas num controle (campo, seletor, controle deslizante)
     ficam com o controle. Esc devolve o teclado à navegação. */
  document.addEventListener("keydown", (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.target.closest && ev.target.closest("input, select, textarea, [contenteditable]")) {
      if (ev.key === "Escape") ev.target.blur();
      return;
    }
    if (ev.target.closest && ev.target.closest("button")) ev.target.blur();
    const k = ev.key;
    if (["l", "L", "ArrowRight", "PageDown", " ", "Enter"].includes(k)) { avancar(); ev.preventDefault(); }
    else if (["h", "H", "ArrowLeft", "PageUp", "Backspace"].includes(k)) { voltar(); ev.preventDefault(); }
    else if (["j", "J", "ArrowDown"].includes(k)) { if (atual < slides.length - 1) ir(atual + 1, true, Infinity); ev.preventDefault(); }
    else if (["k", "K", "ArrowUp"].includes(k)) { if (atual > 0) ir(atual - 1, true, Infinity); ev.preventDefault(); }
    else if (k === "Home") ir(0);
    else if (k === "End") ir(slides.length - 1, true, Infinity);
    else if (k === "f" || k === "F") alternarTelaCheia();
  });

  /* Ajuda guiada: num slide com elementos marcados com data-ajuda="texto", um botão "?" no canto
     percorre esses elementos, na ordem de data-ajuda-ordem (ou do HTML), com um balão em cada um. */
  let ajuda = null;
  function fecharAjuda() { if (ajuda) { ajuda.camada.remove(); ajuda = null; } }
  function mostrarAjuda() {
    const { s, itens, i, camada } = ajuda;
    const el = itens[i];
    const { x, y, w, h } = noSlide(el, s);
    camada.replaceChildren();
    const foco = document.createElement("div");
    foco.className = "ajuda-foco";
    Object.assign(foco.style, { left: x - 10 + "px", top: y - 10 + "px", width: w + 20 + "px", height: h + 20 + "px" });
    const balao = document.createElement("div");
    balao.className = "ajuda-balao";
    balao.innerHTML = `<p></p><div class="ajuda-acoes"><span class="ajuda-conta">${i + 1}/${itens.length}</span>` +
      (i > 0 ? '<button data-a="ant">anterior</button>' : "") +
      `<button data-a="prox" class="ativo">${i < itens.length - 1 ? "próximo" : "fechar"}</button></div>`;
    /* O texto fica como está; o deck pode listar, embaixo, notas de rodapé (ex.: o que cada sigla significa)
       definindo window.notasAjuda(texto) → [[termo, significado], ...]. */
    balao.querySelector("p").textContent = el.dataset.ajuda;
    const notas = window.notasAjuda ? window.notasAjuda(el.dataset.ajuda) : [];
    if (notas.length) {
      const rod = document.createElement("div");
      rod.className = "ajuda-notas";
      for (const [termo, sig] of notas) {
        const l = document.createElement("div");
        l.innerHTML = "<b></b> → <span></span>";
        l.querySelector("b").textContent = termo; l.querySelector("span").textContent = sig;
        rod.append(l);
      }
      balao.querySelector("p").after(rod);
    }
    camada.append(foco, balao);
    /* abaixo do elemento se couber; senão, acima; sempre dentro do slide */
    /* a largura vem antes da medida da altura; depois, tenta abaixo, acima, à direita e à esquerda do
       elemento, e por fim o canto em que menos o cobre. O balão nunca sai da área do slide (margem de 40px). */
    const bw = 560, M = 40, G = 24;
    balao.style.width = bw + "px";
    const bh = balao.offsetHeight;
    const cabe = (bx, by) => bx >= M && by >= M && bx + bw <= 1600 - M && by + bh <= 900 - M;
    const centroX = Math.max(M, Math.min(1600 - bw - M, x + w / 2 - bw / 2));
    const centroY = Math.max(M, Math.min(900 - bh - M, y + h / 2 - bh / 2));
    const opcoes = [[centroX, y + h + G], [centroX, y - bh - G], [x + w + G, centroY], [x - bw - G, centroY]];
    let [bx, by] = opcoes.find(([a, b]) => cabe(a, b)) || [];
    if (bx === undefined) {
      /* nenhum lado livre: o canto do slide mais longe do centro do elemento */
      bx = x + w / 2 < 800 ? 1600 - bw - M : M;
      by = y + h / 2 < 450 ? 900 - bh - M : M;
    }
    Object.assign(balao.style, { left: bx + "px", top: by + "px" });
    balao.addEventListener("click", (ev) => {
      const a = ev.target.dataset.a;
      if (a === "ant") { ajuda.i--; mostrarAjuda(); }
      else if (a === "prox") { if (ajuda.i < itens.length - 1) { ajuda.i++; mostrarAjuda(); } else fecharAjuda(); }
      ev.stopPropagation();
    });
  }
  function abrirAjuda(s) {
    const itens = Array.from(s.querySelectorAll("[data-ajuda]")).filter((el) => el.getClientRects().length)
      .sort((a, b) => (parseFloat(a.dataset.ajudaOrdem) || 0) - (parseFloat(b.dataset.ajudaOrdem) || 0));
    if (!itens.length) return;
    fecharAjuda();
    const camada = document.createElement("div");
    camada.className = "ajuda-camada";
    s.append(camada);
    ajuda = { s, itens, i: 0, camada };
    mostrarAjuda();
  }
  for (const s of slides) {
    if (!s.querySelector("[data-ajuda]")) continue;
    const b = document.createElement("button");
    b.className = "ajuda-botao sangra";
    b.textContent = "?";
    b.title = "ajuda";
    b.addEventListener("click", (ev) => { ev.stopPropagation(); ajuda && ajuda.s === s ? fecharAjuda() : abrirAjuda(s); });
    s.append(b);
  }
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") fecharAjuda(); });

  /* Impressão / PDF: todo slide no seu último estado. Depois, volta ao estado da tela. */
  let estadoNaTela = 0;
  function prepararImpressao() { estadoNaTela = visiveis(slides[atual]); slides.forEach((s) => mostrarPassos(s, Infinity)); }
  window.addEventListener("beforeprint", prepararImpressao);
  window.addEventListener("afterprint", () => ir(atual, false, estadoNaTela));

  /* ---------- Celular e tablet ----------
     Este bloco é igual nos design systems inteli e pecege-ons: ao mudar um, leve a mudança ao outro.
     Arrastar para a esquerda avança e para a direita volta, como → e ←.
     Arrastar para cima vai ao próximo slide e para baixo ao anterior, já completos, como ↓ e ↑.
     Afastar dois dedos (o gesto de zoom) liga a tela cheia; juntar os dois dedos desliga.
     Com o celular em pé, a tela cheia gira o slide para ocupar a tela toda: é só virar o aparelho.
     O zoom do navegador fica desligado no deck, para que o gesto sirva só à tela cheia.
     Um arrasto que começa num campo, seletor, controle deslizante, trecho com rolagem ou elemento
     .sem-gesto fica com ele: um simulador em que se arrasta alguma coisa marca essa área com .sem-gesto. */
  const raizToque = document.documentElement;
  const estiloToque = document.createElement("style");
  estiloToque.textContent = `
    html { touch-action: none; }
    @media screen { html.girado .slide { transform: translate(-50%, -50%) rotate(90deg) scale(var(--escala, 1)); } }
    @media (pointer: coarse) {
      .slide { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      .slide input, .slide textarea, .slide [contenteditable] { -webkit-user-select: text; user-select: text; }
    }
    .aviso-toque { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 1000;
      width: max-content; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px;
      background: rgba(0, 0, 0, .8); color: #fff; font: 14px/1.4 system-ui, sans-serif; text-align: center;
      pointer-events: none; transition: opacity .6s; }
    @media print { .aviso-toque { display: none; } }`;
  document.head.append(estiloToque);

  const emTelaCheia = () => document.fullscreenElement || document.webkitFullscreenElement;
  /* Pede a tela cheia do navegador quando ele permite (no iPhone, não permite: fica só a tela cheia do deck,
     que gira o slide). Precisa vir de um gesto: toque que termina, clique ou tecla. */
  function alternarTelaCheia(ligar = !raizToque.classList.contains("tela-cheia")) {
    raizToque.classList.toggle("tela-cheia", ligar);
    const pedir = raizToque.requestFullscreen || raizToque.webkitRequestFullscreen;
    const sair = document.exitFullscreen || document.webkitExitFullscreen;
    if (ligar && !emTelaCheia() && pedir) {
      Promise.resolve(pedir.call(raizToque))
        .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape"))
        .catch(() => {});
    } else if (!ligar && emTelaCheia() && sair) Promise.resolve(sair.call(document)).catch(() => {});
    escalar();
  }
  /* Saiu da tela cheia pelo navegador (Esc, botão voltar): o deck sai junto. */
  for (const evento of ["fullscreenchange", "webkitfullscreenchange"]) {
    document.addEventListener(evento, () => { if (!emTelaCheia()) { raizToque.classList.remove("tela-cheia"); escalar(); } });
  }

  let toque = null;   /* { x, y }: arrasto com um dedo · { dist, fator }: dois dedos */
  const distancia = (ts) => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  const rola = (el) => {
    for (let e = el; e && e !== document.body; e = e.parentElement) {
      const c = getComputedStyle(e);
      if ((/auto|scroll/.test(c.overflowY) && e.scrollHeight > e.clientHeight + 1) ||
          (/auto|scroll/.test(c.overflowX) && e.scrollWidth > e.clientWidth + 1)) return true;
    }
    return false;
  };
  const ficaComOElemento = (el) => !el.closest || !!el.closest("input, select, textarea, [contenteditable], .sem-gesto") || rola(el);

  document.addEventListener("touchstart", (ev) => {
    if (ev.touches.length === 2) toque = { dist: distancia(ev.touches), fator: 1 };
    else if (ev.touches.length === 1 && !ficaComOElemento(ev.target)) toque = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
    else toque = null;
  }, { passive: true });
  document.addEventListener("touchmove", (ev) => {
    if (ev.touches.length < 2) return;
    ev.preventDefault();   /* nada de zoom do navegador */
    if (toque && toque.dist) toque.fator = distancia(ev.touches) / toque.dist;
  }, { passive: false });
  /* Safari (iOS) faz zoom por gesturestart mesmo com touch-action: none */
  document.addEventListener("gesturestart", (ev) => ev.preventDefault());
  document.addEventListener("touchend", (ev) => {
    if (!toque) return;
    const t = toque;
    toque = null;
    if (t.dist) {
      if (t.fator > 1.25) alternarTelaCheia(true);
      else if (t.fator < 0.8) alternarTelaCheia(false);
      return;
    }
    const fim = ev.changedTouches[0];
    let dx = fim.clientX - t.x, dy = fim.clientY - t.y;
    if (raizToque.classList.contains("girado")) [dx, dy] = [dy, -dx];   /* direções do slide, não da tela */
    const MIN = 40;
    const ajudaAberta = typeof navegarAjuda === "function" && ajuda;
    if (Math.abs(dx) > Math.max(MIN, 1.5 * Math.abs(dy))) {
      if (ajudaAberta) navegarAjuda(dx < 0 ? 1 : -1);
      else if (dx < 0) avancar();
      else voltar();
    } else if (Math.abs(dy) > Math.max(MIN, 1.5 * Math.abs(dx))) {
      if (dy < 0 && atual < slides.length - 1) ir(atual + 1, true, Infinity);
      else if (dy > 0 && atual > 0) ir(atual - 1, true, Infinity);
    }
  });
  document.addEventListener("touchcancel", () => { toque = null; });

  /* Na primeira abertura num aparelho de toque, uma dica rápida dos gestos */
  if (window.matchMedia("(pointer: coarse)").matches) {
    const aviso = document.createElement("div");
    aviso.className = "aviso-toque";
    aviso.textContent = "Arraste para os lados para navegar · afaste dois dedos para a tela cheia";
    document.body.append(aviso);
    setTimeout(() => { aviso.style.opacity = "0"; }, 4000);
    setTimeout(() => aviso.remove(), 5000);
  }

  window.addEventListener("resize", escalar);
  window.addEventListener("hashchange", lerUrl);
  escalar();
  lerUrl();

  /* Usado pelas ferramentas de verificação. */
  window.deck = { ir, total: slides.length, slides, passos: (i) => totalPassos(slides[i]), prepararImpressao };
})();

</script>
</body>
</html>
